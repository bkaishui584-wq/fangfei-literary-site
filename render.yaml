services:
  - type: web
    name: fangfei-literary-site
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/bootstrap
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_PATH
        value: data/fangfei.sqlite3
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_DISPLAY_NAME
        value: 管理员
      - key: ADMIN_PASSWORD
        sync: false